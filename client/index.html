<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blood Duel</title>
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            transition: background-color 0.1s;
        }
        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            background: rgba(0,0,0,0.6);
            padding: 10px 15px;
            font-family: monospace;
            border-radius: 5px;
            pointer-events: none;
            z-index: 10;
        }

        #leaderboardBtn {
        position: absolute;
        top: 20px;
        right: 20px;
        color: #ff4444;
        background: rgba(0, 0, 0, 0.6);
        padding: 10px 15px;
        font-family: monospace;
        border: 2px solid #aa0000;
        border-radius: 5px;
        cursor: pointer;
        z-index: 20;
        transition: background-color 0.15s, color 0.15s, transform 0.15s;
        }

        #leaderboardBtn:hover {
            background: rgba(60, 0, 0, 0.75);
            color: white;
            transform: scale(1.03);
        }

        #leaderboard {
            position: absolute;
            top: 70px;
            right: 20px;
            width: 260px;
            max-height: 360px;
            overflow-y: auto;
            color: #ffcccc;
            background: rgba(0, 0, 0, 0.75);
            padding: 12px 14px;
            font-family: monospace;
            border: 2px solid #660000;
            border-radius: 8px;
            z-index: 20;
            display: none;
            box-shadow: 0 0 18px rgba(120, 0, 0, 0.25);
        }

        #leaderboard h3 {
            margin: 0 0 10px 0;
            color: #ff6666;
            font-size: 15px;
            text-align: center;
        }

        #leaderboard .entry {
            padding: 8px 6px;
            border-bottom: 1px solid rgba(170, 0, 0, 0.35);
            line-height: 1.35;
        }

        #leaderboard .entry:last-child {
            border-bottom: none;
        }

        @keyframes bloodFlash {
            0% { background-color: rgba(255,0,0,0); }
            50% { background-color: rgba(255,0,0,0.5); }
            100% { background-color: rgba(255,0,0,0); }
        }
    </style>
</head>
<body>
    <div id="info">
        BLOODLINE DUEL | <span id="status">Загрузка...</span>
    </div>
    <div id="health-bar-container" style="position: absolute; top: 80px; left: 20px; width: 200px; height: 20px; background: #330000; border: 2px solid #aa0000; border-radius: 5px; z-index: 10;">
        <div id="health-bar" style="width: 100%; height: 100%; background: #aa0000; transition: width 0.3s;"></div>
    </div>
    <div id="essence-display" style="position: absolute; top: 120px; left: 20px; color: #ff4444; font-family: monospace; font-size: 16px; background: rgba(0,0,0,0.7); padding: 5px 10px; border-radius: 5px; z-index: 10;">
        Кровавая сущность: <span id="essence-value">0</span>
    </div>
    <div id="controls-hint" style="position: absolute; bottom: 20px; left: 20px; color: #888; background: rgba(0,0,0,0.5); padding: 5px 10px; font-family: monospace; font-size: 12px; z-index: 10;">
        WASD — движение | ЛКМ по другому игроку — укус (вампиризм)
    </div>
    <div id="ultimate-container" style="position: absolute; bottom: 80px; left: 50%; transform: translateX(-50%); width: 200px; height: 20px; background: #1a0a0a; border: 2px solid #660000; border-radius: 10px; z-index: 10; overflow: hidden;">
    <div id="ultimate-bar" style="width: 0%; height: 100%; background: linear-gradient(90deg, #440000, #ff0000); transition: width 0.3s;"></div>
    </div>
    <div id="ultimate-hint" style="position: absolute; bottom: 60px; left: 50%; transform: translateX(-50%); color: #882222; font-family: monospace; font-size: 12px; z-index: 10;">
        [E] Усиленная атака
    </div>

    <button id="leaderboardBtn">
        Топ игроков
    </button>


    <div id="leaderboard"></div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>

    <script type="module" src="./js/main.js"></script>
</body>
</html>
