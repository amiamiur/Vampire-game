<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blood Duel</title>
    <style>
        body { 
        margin: 0; 
        overflow: hidden; 
        transition: background-color 0.1s;
        }
        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            background: rgba(0,0,0,0.6);
            padding: 10px 15px;
            font-family: monospace;
            border-radius: 5px;
            pointer-events: none;
            z-index: 10;
        }
        @keyframes bloodFlash {
            0% { background-color: rgba(255,0,0,0); }
            50% { background-color: rgba(255,0,0,0.5); }
            100% { background-color: rgba(255,0,0,0); }
        }
    </style>
</head>
<body>
    <div id="info">
        BLOODLINE DUEL | <span id="status">Загрузка...</span>
    </div>
    <div id="health-bar-container" style="position: absolute; top: 80px; left: 20px; width: 200px; height: 20px; background: #330000; border: 2px solid #aa0000; border-radius: 5px; z-index: 10;">
        <div id="health-bar" style="width: 100%; height: 100%; background: #aa0000; transition: width 0.3s;"></div>
    </div>
    <div id="essence-display" style="position: absolute; top: 120px; left: 20px; color: #ff4444; font-family: monospace; font-size: 16px; background: rgba(0,0,0,0.7); padding: 5px 10px; border-radius: 5px; z-index: 10;">
        Кровавая сущность: <span id="essence-value">0</span>
    </div>
    <div id="controls-hint" style="position: absolute; bottom: 20px; left: 20px; color: #888; background: rgba(0,0,0,0.5); padding: 5px 10px; font-family: monospace; font-size: 12px; z-index: 10;">
        WASD — движение | ЛКМ по другому игроку — укус (вампиризм)
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { io } from 'https://cdn.socket.io/4.6.1/socket.io.esm.min.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // --- ИНИЦИАЛИЗАЦИЯ СЦЕНЫ ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a2a);
        scene.fog = new THREE.FogExp2(0x0a0a2a, 0.03);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(10, 8, 12);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.zoomSpeed = 1.2;
        controls.rotateSpeed = 1.0;
        controls.enableZoom = true;
        controls.zoomSpeed = 1.0;
        controls.target.set(0, 1, 0);

        // --- ОСВЕЩЕНИЕ ---
        const ambientLight = new THREE.AmbientLight(0x331133);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xccaa88, 1);
        dirLight.position.set(5, 10, 3);
        dirLight.castShadow = true;
        scene.add(dirLight);

        const fillLight = new THREE.PointLight(0x552222, 0.5);
        fillLight.position.set(0, 2, 0);
        scene.add(fillLight);

        // --- ПОЛ ---
        const gridHelper = new THREE.GridHelper(22, 20, 0xaa5555, 0x442222);
        gridHelper.position.y = -0.5;
        scene.add(gridHelper);

        const groundPlane = new THREE.Mesh(
            new THREE.PlaneGeometry(20, 20),
            new THREE.MeshStandardMaterial({ color: 0x1a0a0a, roughness: 0.8 })
        );
        groundPlane.rotation.x = -Math.PI / 2;
        groundPlane.position.y = -0.6;
        groundPlane.receiveShadow = true;
        scene.add(groundPlane);

        // Декоративные свечи
        const candlePositions = [[-7, -0.3, -7], [7, -0.3, -7], [-7, -0.3, 7], [7, -0.3, 7], [0, -0.3, -8], [0, -0.3, 8]];
        candlePositions.forEach(pos => {
            const candleLight = new THREE.PointLight(0xff6633, 0.5, 10);
            candleLight.position.set(pos[0], pos[1], pos[2]);
            scene.add(candleLight);
            
            // Маленькая "свечка" (кубик)
            const candleGeo = new THREE.CylinderGeometry(0.15, 0.2, 0.4, 6);
            const candleMat = new THREE.MeshStandardMaterial({ color: 0xccaa88 });
            const candleMesh = new THREE.Mesh(candleGeo, candleMat);
            candleMesh.position.set(pos[0], pos[1] + 0.2, pos[2]);
            candleMesh.castShadow = true;
            scene.add(candleMesh);
        });

        // --- КЛАСС ИГРОКА (КУБ С ЦВЕТОМ) ---
        class SimplePlayer {
            constructor(id, x, z, color = 0xaa3333) {
                this.id = id;
                const geometry = new THREE.BoxGeometry(0.8, 0.8, 0.8);
                const material = new THREE.MeshStandardMaterial({ color: color, emissive: 0x220000 });
                this.mesh = new THREE.Mesh(geometry, material);
                this.mesh.castShadow = true;
                this.mesh.position.set(x, 0, z);
                scene.add(this.mesh);
            }
            
            setPosition(x, z) {
                this.mesh.position.set(x, 0, z);
            }
            
            remove() {
                scene.remove(this.mesh);
            }
        }

        // Частицы при атаке
        class BloodParticleSystem {
            constructor(scene) {
                this.scene = scene;
                this.particles = [];
            }
            
            burst(position, count = 12) {
                for (let i = 0; i < count; i++) {
                    const geometry = new THREE.SphereGeometry(0.06, 6, 6);
                    const material = new THREE.MeshStandardMaterial({ 
                        color: 0xcc2222, 
                        emissive: 0x441111,
                        emissiveIntensity: 0.5
                    });
                    const particle = new THREE.Mesh(geometry, material);
                    
                    particle.position.copy(position);
                    particle.userData = {
                        velocity: new THREE.Vector3(
                            (Math.random() - 0.5) * 4,
                            Math.random() * 4 + 1,
                            (Math.random() - 0.5) * 4
                        ),
                        life: 0.6,
                        maxLife: 0.6
                    };
                    
                    this.scene.add(particle);
                    this.particles.push(particle);
                }
            }
            
            update(delta) {
                for (let i = this.particles.length - 1; i >= 0; i--) {
                    const p = this.particles[i];
                    p.userData.life -= delta;
                    
                    if (p.userData.life <= 0) {
                        this.scene.remove(p);
                        this.particles.splice(i, 1);
                        continue;
                    }
                    
                    // Движение
                    p.position.x += p.userData.velocity.x * delta;
                    p.position.y += p.userData.velocity.y * delta;
                    p.position.z += p.userData.velocity.z * delta;
                    
                    // Гравитация
                    p.userData.velocity.y -= 6 * delta;
                    
                    // Прозрачность и размер
                    const opacity = p.userData.life / p.userData.maxLife;
                    p.material.opacity = opacity;
                    p.material.transparent = true;
                    const scale = 0.3 + opacity * 0.5;
                    p.scale.set(scale, scale, scale);
                }
            }
        }

        

        // --- ИГРОВЫЕ ОБЪЕКТЫ ---
        const players = new Map();
        let mySocketId = null;
        let myPlayer = null;

        const socket = io();
        const healthBar = document.getElementById('health-bar');
        const healthValue = document.getElementById('health-value');
        const essenceValueSpan = document.getElementById('essence-value');
        const bloodParticles = new BloodParticleSystem(scene);
        let myHp = 100;
        let myEssence = 0;

        const keyState = {
            w: false,
            s: false,
            a: false,
            d: false
        };

        let moveInterval = null;
        const MOVE_SPEED = 5;
        const BOUNDS = 9;

        function updateUI() {
            const percent = (myHp / 100) * 100;
            healthBar.style.width = `${percent}%`;
            essenceValueSpan.innerText = myEssence;
        }

        socket.on('connect', () => {
            console.log('[CLIENT] Connected to server');
            mySocketId = socket.id;
            document.getElementById('status').innerText = 'Подключено';
        });

        socket.on('player-connected', (playerData) => {
            if (playerData.id !== mySocketId) {
                console.log('[CLIENT] Новый игрок:', playerData.id);
                const newPlayer = new SimplePlayer(playerData.id, playerData.x, playerData.z, 0x883333);
                players.set(playerData.id, newPlayer);
            }
        });

        socket.on('player-moved', (data) => {

            const player = players.get(data.id);
            if (player) {
                player.setPosition(data.x, data.z);
            }
        });

        socket.on('current-players', (playersData) => {
            console.log('[CLIENT] Получены текущие игроки:', playersData);
            let foundSelf = false;
            
            playersData.forEach(p => {
                if (p.id !== mySocketId) {
                    const newPlayer = new SimplePlayer(p.id, p.x, p.z, 0x883333);
                    players.set(p.id, newPlayer);
                } else if (p.id === mySocketId && !myPlayer) {
                    myPlayer = new SimplePlayer(mySocketId, p.x, p.z, 0xcc4444);
                    document.getElementById('status').innerText = 'В игре';
                    foundSelf = true;
                }
            });
            
            // Если своего игрока не нашли в списке, создаём с позицией 0 и 0
            if (!foundSelf && mySocketId && !myPlayer) {
                console.log('[CLIENT] Свой игрок не найден в списке, создаём с 0,0');
                myPlayer = new SimplePlayer(mySocketId, 0, 0, 0xcc4444);
                document.getElementById('status').innerText = 'В игре';
                socket.emit('player-move', { x: 0, z: 0 });
            }
        });

        socket.on('player-disconnected', (id) => {
            console.log('[CLIENT] Игрок отключился:', id);
            const player = players.get(id);
            if (player) {
                player.remove();
                players.delete(id);
            }
        });

        socket.on('player-hurt', (data) => {
             if (data.id === mySocketId) {
                myHp = data.hp;
                updateUI();
                
                document.body.style.animation = 'none';
                setTimeout(() => {
                    document.body.style.animation = 'bloodFlash 0.3s ease-out';
                }, 10);
                
                if (myPlayer) {
                    bloodParticles.burst(myPlayer.mesh.position, 15);
                }
                
                if (myHp <= 0) {
                    document.getElementById('status').innerText = 'Мёртв...';
                }
            } else {
                const hurtPlayer = players.get(data.id);
                if (hurtPlayer && hurtPlayer.mesh.material.opacity !== 0.5) {
                    hurtPlayer.mesh.material.emissiveIntensity = 0.8;
                    setTimeout(() => {
                        if (hurtPlayer.mesh) hurtPlayer.mesh.material.emissiveIntensity = 0.1;
                    }, 200);
                    bloodParticles.burst(hurtPlayer.mesh.position, 15);
                }
            }
        });

        socket.on('essence-update', (data) => {
            if (data.id === mySocketId) {
                myEssence = data.essence;
                updateUI();
            }
        });

        socket.on('player-died', (id) => {
            if (id === mySocketId) {
                console.log('[CLIENT] Вы погибли! Возрождение через 2 секунды...');
                document.getElementById('status').innerText = 'Погиб... возрождение...';
                
                if (moveInterval) {
                    clearInterval(moveInterval);
                    moveInterval = null;
                }
                
                if (myPlayer) {
                    myPlayer.mesh.material.transparent = true;
                    myPlayer.mesh.material.opacity = 0.4;
                    myPlayer.mesh.material.color.setHex(0x331111);
                    myPlayer.mesh.material.emissiveIntensity = 0.05;
                }
            } 
            
            if (id !== mySocketId) {
                const deadPlayer = players.get(id);
                if (deadPlayer) {
                    deadPlayer.mesh.material.color.setHex(0x331111);
                    deadPlayer.mesh.material.emissiveIntensity = 0.05;
                    deadPlayer.mesh.material.transparent = true;
                    deadPlayer.mesh.material.opacity = 0.5;
                }
            }
        });

        socket.on('player-respawn', (data) => {
        if (data.id === mySocketId) {
            myHp = data.hp;
            myEssence = data.essence;
            if (myPlayer) {
                myPlayer.setPosition(data.x, data.z);
                myPlayer.mesh.material.transparent = false;
                myPlayer.mesh.material.opacity = 1;
                myPlayer.mesh.material.color.setHex(0xcc4444);
                myPlayer.mesh.material.emissiveIntensity = 0.1;
            }
            updateUI();
            document.getElementById('status').innerText = 'В игре';
        }
        
        // Отдельно обрабатываем других игроков
        if (data.id !== mySocketId) {
                const respawned = players.get(data.id);
                if (respawned) {
                    respawned.setPosition(data.x, data.z);
                    respawned.mesh.material.color.setHex(0x883333);
                    respawned.mesh.material.emissiveIntensity = 0.1;
                    respawned.mesh.material.transparent = false;
                    respawned.mesh.material.opacity = 1;
                }
            }
        });

        

        window.addEventListener('keydown', (e) => {
            const key = e.key.toLowerCase();
            if (key === 'w') keyState.w = true;
            if (key === 's') keyState.s = true;
            if (key === 'a') keyState.a = true;
            if (key === 'd') keyState.d = true;
            
            if (!moveInterval) {
                startMoving();
            }
        });

        window.addEventListener('keyup', (e) => {
            const key = e.key.toLowerCase();
            if (key === 'w') keyState.w = false;
            if (key === 's') keyState.s = false;
            if (key === 'a') keyState.a = false;
            if (key === 'd') keyState.d = false;
            
            // Если ни одна клавиша не нажата — останавливаем интервал
            if (!keyState.w && !keyState.s && !keyState.a && !keyState.d) {
                if (moveInterval) {
                    clearInterval(moveInterval);
                    moveInterval = null;
                }
            }
        });

        function startMoving() {
            if (moveInterval) return;
            
            let lastTime = performance.now();
            
            moveInterval = setInterval(() => {
                if (!myPlayer) return;
                
                const now = performance.now();
                let delta = Math.min(0.033, (now - lastTime) / 1000);
                lastTime = now;

                const cameraDirection = camera.getWorldDirection(new THREE.Vector3());
                const cameraRight = new THREE.Vector3().crossVectors(cameraDirection, new THREE.Vector3(0, 1, 0));
                
                let moveDirection = new THREE.Vector3(0, 0, 0);
                
                if (keyState.w) moveDirection.z += 1;
                if (keyState.s) moveDirection.z -= 1;
                if (keyState.a) moveDirection.x -= 1;
                if (keyState.d) moveDirection.x += 1;
                
                if (moveDirection.length() > 0) {
                    moveDirection.normalize();
                }
                
                // Преобразуем в мировые координаты
                const forward = new THREE.Vector3(cameraDirection.x, 0, cameraDirection.z).normalize();
                const right = new THREE.Vector3(cameraRight.x, 0, cameraRight.z).normalize();
                
                const deltaX = (moveDirection.x * right.x + moveDirection.z * forward.x) * MOVE_SPEED * delta;
                const deltaZ = (moveDirection.x * right.z + moveDirection.z * forward.z) * MOVE_SPEED * delta;
                
                if (deltaX !== 0 || deltaZ !== 0) {
                    const newX = Math.min(BOUNDS, Math.max(-BOUNDS, myPlayer.mesh.position.x + deltaX));
                    const newZ = Math.min(BOUNDS, Math.max(-BOUNDS, myPlayer.mesh.position.z + deltaZ));
                    myPlayer.setPosition(newX, newZ);
                    
                    socket.emit('player-move', { x: newX, z: newZ });
                }
            }, 1000 / 30);
        }

        // атака
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        window.addEventListener('click', (event) => {
            if (!myPlayer || myHp <= 0) return;
            
            mouse.x = (event.clientX / renderer.domElement.clientWidth) * 2 - 1;
            mouse.y = -(event.clientY / renderer.domElement.clientHeight) * 2 + 1;
            
            raycaster.setFromCamera(mouse, camera);
            
            const alivePlayers = Array.from(players.values())
                .filter(p => p.mesh.material.opacity !== 0.5)
                .map(p => p.mesh);
            
            const intersects = raycaster.intersectObjects(alivePlayers);
            
            if (intersects.length > 0) {
                const hitMesh = intersects[0].object;
                for (let [id, player] of players.entries()) {
                    if (player.mesh === hitMesh) {
                        console.log(`[CLIENT] Атака игрока ${id}`);
                        socket.emit('player-attack', id);
                        break;
                    }
                }
            }
        });

        // анимация камеры 
        function animate() {
            requestAnimationFrame(animate);
            
            const now = performance.now();
            const delta = Math.min(0.033, (now - (window._lastFrame || now)) / 1000);
            window._lastFrame = now;

            bloodParticles.update(delta);

            if (myPlayer) {
                controls.target.set(
                    myPlayer.mesh.position.x,
                    myPlayer.mesh.position.y + 0.5,  // чуть выше центра куба
                    myPlayer.mesh.position.z
                );
            }
            
            controls.update();
            
            // Мерцание свечей
            let time = Date.now() * 0.003;
            scene.children.forEach(child => {
                if (child instanceof THREE.PointLight && child.intensity < 1.0) {
                    child.intensity = 0.4 + Math.sin(time + child.position.x) * 0.2;
                }
            });
            
            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        console.log('[CLIENT] Bloodline Duel клиент запущен');
    </script>
</body>
</html>
