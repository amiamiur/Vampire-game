<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blood Duel</title>
    <style>
        body { margin: 0; overflow: hidden; }
        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            background: rgba(0,0,0,0.6);
            padding: 10px 15px;
            font-family: monospace;
            border-radius: 5px;
            pointer-events: none;
            z-index: 10;
        }
    </style>
</head>
<body>
    <div id="info">
        BLOODLINE DUEL | <span id="status">Загрузка...</span>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a2a); // тёмно-синий, почти ночной
        
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(5, 5, 5);
        camera.lookAt(0, 0, 0);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);
        
        const geometry = new THREE.BoxGeometry(0.8, 0.8, 0.8);
        const material = new THREE.MeshStandardMaterial({ color: 0xaa3333 });
        const cube = new THREE.Mesh(geometry, material);
        cube.castShadow = true;
        scene.add(cube);

        const ambientLight = new THREE.AmbientLight(0x404040);
        scene.add(ambientLight);
        
         const gridHelper = new THREE.GridHelper(20, 20, 0xaa5555, 0x442222);
        gridHelper.position.y = -0.5;
        scene.add(gridHelper);
        
        // Полупрозрачная плоскость под ногами
        const groundPlane = new THREE.Mesh(
            new THREE.PlaneGeometry(18, 18),
            new THREE.MeshStandardMaterial({ color: 0x1a0a0a, roughness: 0.7, metalness: 0.1 })
        );
        groundPlane.rotation.x = -Math.PI / 2;
        groundPlane.position.y = -0.6;
        groundPlane.receiveShadow = true;
        scene.add(groundPlane);
        
        // --- УЛУЧШЕННОЕ ОСВЕЩЕНИЕ ---
        // Задний тёплый свет
        const backLight = new THREE.PointLight(0x553333, 0.5);
        backLight.position.set(-3, 2, -4);
        scene.add(backLight);
        
        // Красноватый fill свет снизу (эффект вампирской ауры)
        const fillRed = new THREE.PointLight(0x441111, 0.3);
        fillRed.position.set(0, -1, 0);
        scene.add(fillRed);
        
        // Маленькие точечные свечи по углам (декоративные)
        const candlePositions = [
            [-7, -0.3, -7], [7, -0.3, -7], [-7, -0.3, 7], [7, -0.3, 7]
        ];
        candlePositions.forEach(pos => {
            const candleLight = new THREE.PointLight(0xff6633, 0.4, 8);
            candleLight.position.set(pos[0], pos[1], pos[2]);
            scene.add(candleLight);
        });
        
        // Анимация куба (лёгкое вращение, чтобы было видно что 3D работает)
        function animate() {
            requestAnimationFrame(animate);
            cube.rotation.y += 0.01;
            cube.rotation.x += 0.005;
            renderer.render(scene, camera);
        }
        animate();
        
        document.getElementById('status').innerText = '3D сцена загружена';
        console.log('Three.js сцена запущена');
        
        window.addEventListener('resize', onWindowResize, false);
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
    </script>
</body>
</html>
